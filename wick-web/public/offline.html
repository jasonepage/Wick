<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141019">
<title>Wick: offline</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: #141019; color: #f3eefb; text-align: center;
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 0 16px;
  }
  main { max-width: 360px; }
  .flame { font-size: 64px; line-height: 1; }
  h1 { font-size: 1.5rem; margin: 16px 0 8px; }
  p { color: #b9aed0; margin: 0 0 24px; }
  button {
    font: inherit; font-weight: 700; color: #fff; background: #8b5cf6;
    border: 0; border-radius: 16px; padding: 14px 28px; cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <div class="flame" aria-hidden="true">🔥</div>
  <h1>You're offline</h1>
  <p>Wick needs a connection to score your guesses. Check your internet, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
