<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Wick — Guess by meaning</title>
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#141019" />
    <meta name="description" content="Wick is a daily word game: guess the secret word by meaning — warmer as you get closer, hotter until you solve it." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wick" />
    <meta property="og:url" content="https://guesswick.com/" />
    <meta property="og:title" content="Wick — Guess by meaning" />
    <meta property="og:description" content="A daily guess-by-meaning word game. Warmer as you get closer." />
    <!-- Absolute URL: crawlers do not resolve relative paths. preview.ts already
         does this for invite links; the root page had no image at all, so every
         share of guesswick.com rendered as a bare text row. -->
    <meta property="og:image" content="https://guesswick.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Wick — guess the secret word by meaning." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Wick — Guess by meaning" />
    <meta name="twitter:description" content="A daily guess-by-meaning word game. Warmer as you get closer." />
    <meta name="twitter:image" content="https://guesswick.com/og-image.jpg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Resolve the theme BEFORE first paint. Without this the page renders one
         frame with no theme class, which is a white flash on the way into dark
         mode. Mirrors themePref()/resolvedTheme() in src/main.ts — keep the
         storage key in sync with those. -->
    <script>
      (function () {
        var v = null;
        try { v = localStorage.getItem("wick.theme"); } catch (e) { /* storage off */ }
        var t = (v === "light" || v === "dark") ? v
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.body.className = "theme-" + t;
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
