# Dependabot: small updates only (no major versions), once a month,
# one grouped pull request per folder.
version: 2
updates:
  - package-ecosystem: npm
    directory: /wick-api
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      server-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Server"

  - package-ecosystem: npm
    directory: /wick-web
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      web-dependencies:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "Web"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "CI"
