# Dependabot: one grouped update a month per folder, so a one person project
# is not flooded with pull requests. Security updates still arrive right away
# when "Dependabot security updates" is turned on in the repository settings.

version: 2
updates:
  - package-ecosystem: npm
    directory: /wick-api
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      server-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "Server"

  - package-ecosystem: npm
    directory: /wick-web
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      web-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "Web"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "CI"
