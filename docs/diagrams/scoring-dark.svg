<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 330" width="1020" height="330" role="img" aria-label="How a guess is scored. The guess and the secret word are each turned into an embedding, a list of numbers. The server compares the angle between them, then ranks the guess among about ten thousand common words sorted by closeness to the secret. The rank picks the band: boiling at 25 or better, hot at 100, warm at 400, cool at 1200, cold beyond. An exact match is solved." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A79FB0"/></marker>
<marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF6B35"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9C7CFF"/></marker>
</defs>
<rect width="1020" height="330" fill="#15121A"/>
<text x="20" y="30" text-anchor="start" font-family="system-ui,sans-serif" font-size="15" fill="#F1EAF5" font-weight="600">A guess, scored</text><text x="20" y="50" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#A79FB0">example: the secret is red, you type tomato</text><rect x="20" y="78" width="180" height="64" rx="10" fill="#1E1A25" stroke="#3A3344" stroke-width="1.5"/><text x="110.0" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#A79FB0">your guess</text><text x="110.0" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#F1EAF5" font-weight="600">tomato</text><path d="M202 110.0 L218 110.0" fill="none" stroke="#A79FB0" stroke-width="1.5" marker-end="url(#a)"/><rect x="220" y="78" width="180" height="64" rx="10" fill="#1E1A25" stroke="#3A3344" stroke-width="1.5"/><text x="310.0" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#A79FB0">embedding</text><text x="310.0" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#A79FB0" font-weight="600">a list of numbers</text><path d="M402 110.0 L418 110.0" fill="none" stroke="#A79FB0" stroke-width="1.5" marker-end="url(#a)"/><rect x="420" y="78" width="180" height="64" rx="10" fill="#1E1A25" stroke="#3A3344" stroke-width="1.5"/><text x="510.0" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#A79FB0">cosine vs secret</text><text x="510.0" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#A79FB0" font-weight="600">0.86</text><path d="M602 110.0 L618 110.0" fill="none" stroke="#A79FB0" stroke-width="1.5" marker-end="url(#a)"/><rect x="620" y="78" width="180" height="64" rx="10" fill="#1E1A25" stroke="#FF6B35" stroke-width="1.5"/><text x="710.0" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#A79FB0">rank among 9,850 words</text><text x="710.0" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#FF6B35" font-weight="600">top 100</text><path d="M802 110.0 L818 110.0" fill="none" stroke="#A79FB0" stroke-width="1.5" marker-end="url(#a)"/><rect x="820" y="78" width="180" height="64" rx="10" fill="#1E1A25" stroke="#FF6B35" stroke-width="1.5"/><text x="910.0" y="102" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#A79FB0">band</text><text x="910.0" y="126" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" fill="#F0703A" font-weight="600">Hot</text><text x="310" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#6F6879">Gemini embedding API, server side</text><text x="710" y="160" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#6F6879">secret's neighbors, cached once per secret</text><text x="20" y="196" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#F1EAF5" font-weight="600">Rank picks the band. Lower rank is closer in meaning.</text><rect x="20" y="210" width="146" height="14" rx="4" fill="#EE4A3E"/><text x="93.0" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#EE4A3E" font-weight="600">Boiling</text><text x="93.0" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#A79FB0">1 to 25</text><rect x="170" y="210" width="146" height="14" rx="4" fill="#F0703A"/><text x="243.0" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#F0703A" font-weight="600">Hot</text><text x="243.0" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#A79FB0">26 to 100</text><rect x="320" y="210" width="176" height="14" rx="4" fill="#F4AE2E"/><text x="408.0" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#F4AE2E" font-weight="600">Warm</text><text x="408.0" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#A79FB0">101 to 400</text><rect x="500" y="210" width="176" height="14" rx="4" fill="#2AAE98"/><text x="588.0" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#2AAE98" font-weight="600">Cool</text><text x="588.0" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#A79FB0">401 to 1200</text><rect x="680" y="210" width="146" height="14" rx="4" fill="#5CC2BA"/><text x="753.0" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#5CC2BA" font-weight="600">Cold</text><text x="753.0" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#A79FB0">1201 and beyond</text><rect x="830" y="210" width="166" height="14" rx="4" fill="#4F8DEB"/><text x="913.0" y="244" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#4F8DEB" font-weight="600">Freezing</text><text x="913.0" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#A79FB0">not in the list</text><text x="20" y="300" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#A79FB0">An exact match short-circuits to Solved. A guess that is not a dictionary word is not scored at all.</text><text x="20" y="318" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#A79FB0">On iOS single player the same steps run on the phone with Apple's embedding, and nothing is sent anywhere.</text></svg>
