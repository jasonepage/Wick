<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 370" width="1020" height="370" role="img" aria-label="Where this is going: packs. The server stays the single judge of what is fair: the secret word, the scoring, the rank bands, the clock and the dictionary are the same for everyone. Everything the player sees and hears is meant to become a pack: colors, sounds, the Keeper's character and lines, the heat words, the share card. A pack is a folder with a manifest and assets, like an osu! skin. Planned, not built." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#A79FB0"/></marker>
<marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF6B35"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9C7CFF"/></marker>
</defs>
<rect width="1020" height="370" fill="#15121A"/>
<text x="20" y="30" text-anchor="start" font-family="system-ui,sans-serif" font-size="15" fill="#F1EAF5" font-weight="600">Where this is going: packs</text><text x="20" y="50" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#A79FB0">planned, not built. The split is the point: fair in the middle, yours at the edges.</text><rect x="20" y="70" width="400" height="210" rx="10" fill="#1E1A25" stroke="#FF6B35" stroke-width="1.5"/><text x="220" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#FF6B35" font-weight="600">the server judges</text><text x="220" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#A79FB0">same for every player, every client, every pack</text><circle cx="48" cy="142" r="4" fill="#FF6B35"/><text x="62" y="146" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#F1EAF5">today's secret word and the daily number</text><circle cx="48" cy="170" r="4" fill="#FF6B35"/><text x="62" y="174" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#F1EAF5">the score, the rank and the band cutoffs</text><circle cx="48" cy="198" r="4" fill="#FF6B35"/><text x="62" y="202" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#F1EAF5">what counts as a real word</text><circle cx="48" cy="226" r="4" fill="#FF6B35"/><text x="62" y="230" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#F1EAF5">the Race clock and who solved first</text><circle cx="48" cy="254" r="4" fill="#FF6B35"/><text x="62" y="258" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#F1EAF5">rate limits and abuse checks</text><rect x="600" y="70" width="400" height="210" rx="10" fill="#1E1A25" stroke="#9C7CFF" stroke-width="1.5"/><text x="800" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#9C7CFF" font-weight="600">a pack changes</text><text x="800" y="114" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#A79FB0">a folder: manifest.json plus assets, swapped per player</text><circle cx="628" cy="142" r="4" fill="#9C7CFF"/><text x="642" y="146" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#F1EAF5">colors and the band palette</text><circle cx="628" cy="170" r="4" fill="#9C7CFF"/><text x="642" y="174" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#F1EAF5">sounds for each heat step and the solve</text><circle cx="628" cy="198" r="4" fill="#9C7CFF"/><text x="642" y="202" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#F1EAF5">the Keeper: name, face, voice lines</text><circle cx="628" cy="226" r="4" fill="#9C7CFF"/><text x="642" y="230" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#F1EAF5">the heat words (Freezing ... Boiling)</text><circle cx="628" cy="254" r="4" fill="#9C7CFF"/><text x="642" y="258" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#F1EAF5">share card and reveal map styling</text><rect x="440" y="150" width="140" height="80" rx="10" fill="#15121A" stroke="#3A3344" stroke-width="1.5"/><text x="510" y="176" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#F1EAF5" font-weight="600">wire protocol</text><text x="510" y="194" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#A79FB0">score, rank, band</text><text x="510" y="210" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#A79FB0">numbers only</text><path d="M422 190 L438 190" fill="none" stroke="#FF6B35" stroke-width="1.5" marker-end="url(#af)"/><path d="M582 190 L598 190" fill="none" stroke="#9C7CFF" stroke-width="1.5" marker-end="url(#ak)"/><text x="20" y="315" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#A79FB0">Today those pieces live in code: HunchTheme.swift, Sounds/, OfflineKeeper.swift, Loc.swift on iOS; style.css, sound.ts, i18n.ts on the web.</text><text x="20" y="333" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#A79FB0">The first step is to move them behind one interface per platform so a pack can replace them without touching the engine.</text><text x="20" y="351" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#F1EAF5" font-weight="600">A pack can never change a score. Scoring lives in the engine, and a pack cannot reach it.</text></svg>
