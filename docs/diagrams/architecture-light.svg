<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 486" width="1020" height="486" role="img" aria-label="How the parts fit. The iOS app plays single player entirely on the phone using Apple's word embedding and on-device Foundation Models. The web client runs the daily puzzle in the browser but asks the wick-api server to score each guess. Live races from either client go over a WebSocket to wick-api, which keeps the match in memory and scores both players. Only wick-api talks to the Gemini API, with the one key, read from its environment." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5E5768"/></marker>
<marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E85A22"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#6B4FE0"/></marker>
</defs>
<rect width="1020" height="486" fill="#FFFFFF"/>
<text x="20" y="30" text-anchor="start" font-family="system-ui,sans-serif" font-size="15" fill="#1B1720" font-weight="600">How the parts fit</text><text x="20" y="50" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#5E5768">one secret per system: the Gemini key, on the server, read from the environment</text><rect x="20" y="70" width="300" height="250" rx="10" fill="#F6F3FA" stroke="#D8D2E0" stroke-width="1.5"/><text x="170" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#1B1720" font-weight="600">iOS app</text><text x="170" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5E5768">Hunch/  (SwiftUI, iOS 17+)</text><rect x="360" y="70" width="300" height="250" rx="10" fill="#F6F3FA" stroke="#D8D2E0" stroke-width="1.5"/><text x="510" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#1B1720" font-weight="600">wick-api</text><text x="510" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5E5768">wick-api/  (Node + Hono + ws)</text><rect x="700" y="70" width="300" height="250" rx="10" fill="#F6F3FA" stroke="#D8D2E0" stroke-width="1.5"/><text x="850" y="94" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#1B1720" font-weight="600">web client</text><text x="850" y="112" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5E5768">wick-web/  (Vite + TypeScript)</text><rect x="32" y="126" width="276" height="86" rx="10" fill="#FFFFFF" stroke="#D8D2E0" stroke-width="1.5"/><text x="170" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3E8F3A" font-weight="600">single player, on the phone</text><text x="170" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">NLEmbedding (English)</text><text x="170" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">bundled Core ML models (ES, FR, IT, DE)</text><text x="170" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">Foundation Models answers the Keeper</text><rect x="32" y="222" width="276" height="86" rx="10" fill="#FFFFFF" stroke="#D8D2E0" stroke-width="1.5"/><text x="170" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#E85A22" font-weight="600">live Race</text><text x="170" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">MatchClient  ->  WebSocket /match</text><text x="170" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">server base from Config/Wick.xcconfig</text><text x="170" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">POST /validate-word for custom words</text><rect x="712" y="126" width="276" height="86" rx="10" fill="#FFFFFF" stroke="#D8D2E0" stroke-width="1.5"/><text x="850" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#3E8F3A" font-weight="600">daily puzzle, in the browser</text><text x="850" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">same seeded shuffle as iOS (daily.ts)</text><text x="850" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">stats and streak in localStorage</text><text x="850" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">no API key, ever</text><rect x="712" y="222" width="276" height="86" rx="10" fill="#FFFFFF" stroke="#D8D2E0" stroke-width="1.5"/><text x="850" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#E85A22" font-weight="600">asks the server</text><text x="850" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">POST /warmth   { secret, guess }</text><text x="850" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">POST /keeper   { secret, question }</text><text x="850" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">WebSocket /match for live Race</text><rect x="372" y="126" width="276" height="86" rx="10" fill="#FFFFFF" stroke="#D8D2E0" stroke-width="1.5"/><text x="510" y="146" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#E85A22" font-weight="600">scoring</text><text x="510" y="164" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">warmthservice: cosine -> rank -> band</text><text x="510" y="180" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">rank vocab embedded once at boot</text><text x="510" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">dictionary check, LRU cache, rate limits</text><rect x="372" y="222" width="276" height="86" rx="10" fill="#FFFFFF" stroke="#D8D2E0" stroke-width="1.5"/><text x="510" y="242" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#E85A22" font-weight="600">matches</text><text x="510" y="260" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">hub -> room -> bot, all in memory</text><text x="510" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">no database, no accounts</text><text x="510" y="292" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1B1720">serves the built web client too</text><path d="M322 265 L356 265" fill="none" stroke="#E85A22" stroke-width="1.5" marker-end="url(#af)"/><text x="339" y="253" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8E8798">wss</text><path d="M698 265 L664 265" fill="none" stroke="#E85A22" stroke-width="1.5" marker-end="url(#af)"/><text x="681" y="253" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#8E8798">https / wss</text><rect x="360" y="350" width="300" height="64" rx="10" fill="#F6F3FA" stroke="#6B4FE0" stroke-width="1.5"/><text x="510" y="374" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#6B4FE0" font-weight="600">Google Gemini API</text><text x="510" y="394" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#5E5768">embedContent (scoring), generateContent (Keeper)</text><path d="M510 322 L510 346" fill="none" stroke="#6B4FE0" stroke-width="1.5" marker-end="url(#ak)"/><text x="530" y="338" text-anchor="start" font-family="system-ui,sans-serif" font-size="10" fill="#8E8798">GEMINI_API_KEY from env</text><text x="20" y="442" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#5E5768">The iOS app needs no server to play the daily puzzle.</text><text x="20" y="460" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#5E5768">The server never learns who you are: no accounts, no logins.</text><text x="20" y="478" text-anchor="start" font-family="system-ui,sans-serif" font-size="12" fill="#5E5768">Self-hosting: run wick-api with your key, point both clients at it.</text></svg>
